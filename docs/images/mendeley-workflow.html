<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Using Mendeley in ONLYOFFICE</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(45,49,66,0.12);
      --accent: #eb6c36;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { background: var(--paper); color: var(--ink); font-family: var(--sans); padding: 32px; }
    main { max-width: 1280px; margin: 0 auto; }
    h1 { font: 400 28px/1.15 var(--serif); margin: 0 0 16px; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1280px; }
    .ink { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .soft { fill: var(--soft); }
    .name { font: 600 12px var(--sans); fill: var(--ink); text-anchor: middle; }
    .sub { font: 400 9px var(--mono); fill: var(--muted); text-anchor: middle; }
    .label { font: 500 8px var(--mono); letter-spacing: .06em; fill: var(--muted); text-anchor: middle; }
    .legend { font: 400 9px var(--mono); fill: var(--muted); }
    .action { fill: #fff; stroke: var(--ink); stroke-width: 1; }
    .start-end { fill: rgba(45,49,66,.05); stroke: var(--muted); stroke-width: 1; }
    .decision { fill: rgba(45,49,66,.03); stroke: var(--muted); stroke-width: 1; }
    .focal { fill: rgba(235,108,54,.08); stroke: var(--accent); stroke-width: 1.5; }
    .route { fill: none; stroke: var(--muted); stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <main>
    <h1>Use Mendeley in ONLYOFFICE</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" role="img" aria-labelledby="mendeley-workflow-title mendeley-workflow-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="mendeley-workflow-title">Use Mendeley in ONLYOFFICE</title>
        <desc id="mendeley-workflow-desc">Choose Desktop Editors or Document Server, connect through Desktop session auto-detection or manual Web OAuth, find references, and insert citations or a bibliography.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker>
        </defs>
        <rect width="1280" height="720" fill="#f5f5f5"/>

        <g class="route" marker-end="url(#arrow)">
          <path d="M640 96V140"/>
          <path d="M540 192H328Q320 192 320 200V254"/>
          <path d="M740 192H952Q960 192 960 200V254"/>
          <path d="M320 330V370Q320 378 328 378H632"/>
          <path d="M960 330V370Q960 378 952 378H648"/>
          <path d="M640 386V416"/>
          <path d="M640 464V488"/>
          <path d="M640 536V560"/>
          <path d="M640 608V632"/>
        </g>

        <g aria-label="Start">
          <rect class="start-end" x="560" y="48" width="160" height="48" rx="24"/>
          <text class="name" x="640" y="77">Start</text>
        </g>

        <g aria-label="Choose installation">
          <path class="decision" d="M640 140L740 192L640 244L540 192Z"/>
          <text class="name" x="640" y="190">Where will you use</text>
          <text class="name" x="640" y="206">ONLYOFFICE?</text>

        <g>
          <rect x="442" y="158" width="76" height="24" rx="2" fill="#f5f5f5"/>
          <text class="label" x="480" y="174">DESKTOP</text>
          <rect x="762" y="158" width="116" height="24" rx="2" fill="#f5f5f5"/>
          <text class="label" x="820" y="174">DOCUMENT SERVER</text>
        </g>

        <g aria-label="Install for Desktop Editors">
          <rect class="focal" x="200" y="254" width="240" height="76" rx="6"/>
          <text class="name" x="320" y="283">Desktop Editors</text>
          <text class="sub" x="320" y="303">Install package, run setup</text>
          <text class="sub" x="320" y="317">Linux or Windows</text>
        </g>

        <g aria-label="Install for Document Server">
          <rect class="action" x="840" y="254" width="240" height="76" rx="6"/>
          <text class="name" x="960" y="283">Document Server</text>
          <text class="sub" x="960" y="303">Deploy plugin to server</text>
          <text class="sub" x="960" y="317">Self-hosted</text>
        </g>

        <circle cx="640" cy="378" r="8" fill="#2d3142" aria-label="Installation paths merge"/>
        <g aria-label="Configure Mendeley">
          <rect class="action" x="480" y="416" width="320" height="48" rx="6"/>
          <text class="name" x="640" y="437">Connect Mendeley</text>
          <text class="sub" x="640" y="453">Desktop session auto-connect · Web OAuth fallback</text>
        </g>

        <g aria-label="Find references">
          <rect class="action" x="480" y="488" width="320" height="48" rx="6"/>
          <text class="name" x="640" y="509">Find and select references</text>
          <text class="sub" x="640" y="525">Search, collections, favorites</text>
        </g>

        <g aria-label="Insert citation or bibliography">
          <rect class="action" x="480" y="560" width="320" height="48" rx="6"/>
          <text class="name" x="640" y="581">Choose style and insert</text>
          <text class="sub" x="640" y="597">Citation at cursor · bibliography at end</text>
        </g>

        <g aria-label="Finished">
          <rect class="start-end" x="540" y="632" width="200" height="44" rx="22"/>
          <text class="name" x="640" y="659">Formatted references added</text>
        </g>

        <g transform="translate(392 700)">
          <rect class="start-end" x="0" y="-9" width="24" height="16" rx="8"/>
          <text class="legend" x="32" y="3">start / result</text>
          <rect class="action" x="152" y="-9" width="24" height="16" rx="4"/>
          <text class="legend" x="184" y="3">action</text>
          <path class="decision" d="M292 -9L304 -1L292 7L280 -1Z"/>
          <text class="legend" x="312" y="3">choice</text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
