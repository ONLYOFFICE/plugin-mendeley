<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mendeley OAuth flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(45,49,66,0.12);
      --accent: #eb6c36;
      --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; padding: 36px 24px; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    main { width: 100%; max-width: 960px; margin: 0 auto; }
    .eyebrow { margin-bottom: 8px; color: var(--muted); font: 500 8px var(--mono); letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin-bottom: 20px; font: 400 28px/1.15 var(--serif); letter-spacing: -.02em; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 960px; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Authentication · Sequence</p>
    <h1>Mendeley OAuth flow</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mendeley-auth-title mendeley-auth-desc">
        <title id="mendeley-auth-title">Mendeley OAuth flow</title>
        <desc id="mendeley-auth-desc">Shows manual sign-in, helper token cleanup, Desktop and Document Server callbacks, local token storage, and authenticated API access.</desc>
        <defs>
          <marker id="mendeley-auth-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="mendeley-auth-arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="mendeley-auth-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="960" height="600" fill="#f5f5f5"/>

        <g fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="3,3">
          <line x1="112" y1="104" x2="112" y2="536"/>
          <line x1="296" y1="104" x2="296" y2="536"/>
          <line x1="480" y1="104" x2="480" y2="536"/>
          <line x1="664" y1="104" x2="664" y2="536"/>
          <line x1="848" y1="104" x2="848" y2="536"/>
        </g>

        <g>
          <rect x="276" y="152" width="596" height="296" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)"/>
          <rect x="276" y="152" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)"/>
          <text x="296" y="164" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing=".12em">ALT</text>
          <text x="328" y="164" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8">[Desktop Editors]</text>
          <line x1="284" y1="332" x2="864" y2="332" stroke="rgba(45,49,66,0.20)" stroke-dasharray="4,3"/>
          <text x="296" y="350" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8">[Document Server]</text>
        </g>

        <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mendeley-auth-arrow)">
          <line x1="112" y1="128" x2="296" y2="128"/>
          <line x1="296" y1="196" x2="848" y2="196"/>
          <line x1="296" y1="224" x2="480" y2="224" marker-end="url(#mendeley-auth-arrow-link)"/>
          <line x1="480" y1="252" x2="848" y2="252"/>
          <line x1="296" y1="280" x2="848" y2="280"/>
          <line x1="296" y1="376" x2="480" y2="376" marker-end="url(#mendeley-auth-arrow-link)"/>
          <line x1="480" y1="404" x2="664" y2="404"/>
          <line x1="296" y1="504" x2="480" y2="504" marker-end="url(#mendeley-auth-arrow-link)"/>
        </g>
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#mendeley-auth-arrow-return)">
          <line x1="848" y1="308" x2="296" y2="308"/>
          <line x1="664" y1="432" x2="296" y2="432"/>
          <line x1="480" y1="532" x2="296" y2="532"/>
        </g>
        <g fill="none" stroke="#4f5d75" stroke-width="1.2">
          <path d="M296 472h20v24h-20" marker-end="url(#mendeley-auth-arrow)"/>
        </g>

        <g font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing=".06em" fill="#7a8399">
          <rect x="164" y="108" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="204" y="117">LOGIN</text>
          <rect x="520" y="176" width="104" height="12" rx="2" fill="#f5f5f5"/><text x="572" y="185">DELETE /TOKEN</text>
          <rect x="340" y="204" width="96" height="12" rx="2" fill="#f5f5f5"/><text x="388" y="213">AUTHORIZE</text>
          <rect x="608" y="232" width="112" height="12" rx="2" fill="#f5f5f5"/><text x="664" y="241">REDIRECT TOKEN</text>
          <rect x="556" y="260" width="88" height="12" rx="2" fill="#f5f5f5"/><text x="600" y="269">GET /TOKEN</text>
          <rect x="548" y="288" width="112" height="12" rx="2" fill="#f5f5f5"/><text x="604" y="297">TOKEN RESPONSE</text>
          <rect x="340" y="356" width="96" height="12" rx="2" fill="#f5f5f5"/><text x="388" y="365">AUTHORIZE</text>
          <rect x="520" y="384" width="104" height="12" rx="2" fill="#f5f5f5"/><text x="572" y="393">REDIRECT TOKEN</text>
          <rect x="420" y="412" width="96" height="12" rx="2" fill="#f5f5f5"/><text x="468" y="421">OAUTH CALLBACK</text>
          <rect x="324" y="452" width="112" height="12" rx="2" fill="#f5f5f5"/><text x="380" y="461">STORE TOKEN</text>
          <rect x="332" y="484" width="128" height="12" rx="2" fill="#f5f5f5"/><text x="396" y="493">BEARER REQUEST</text>
          <rect x="328" y="512" width="112" height="12" rx="2" fill="#f5f5f5"/><text x="384" y="521">DATA / 401</text>
        </g>

        <g font-family="'Geist',sans-serif" text-anchor="middle" fill="#2d3142">
          <g><rect x="56" y="56" width="112" height="48" rx="6" fill="#ececec" stroke="#7a8399"/><text x="112" y="85" font-size="12" font-weight="600">User</text></g>
          <g><rect x="224" y="56" width="144" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="296" y="80" font-size="12" font-weight="600">ONLYOFFICE</text><text x="296" y="96" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">plugin + localStorage</text></g>
          <g><rect x="420" y="56" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="480" y="80" font-size="12" font-weight="600">Mendeley</text><text x="480" y="96" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">OAuth + API</text></g>
          <g><rect x="600" y="56" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="664" y="80" font-size="12" font-weight="600">oauth.html</text><text x="664" y="96" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">Document Server</text></g>
          <g><rect x="776" y="56" width="144" height="48" rx="6" fill="#ececec" stroke="#7a8399"/><text x="848" y="80" font-size="12" font-weight="600">Loopback helper</text><text x="848" y="96" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">127.0.0.1:8080</text></g>
        </g>

        <text x="40" y="552" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8">LOGIN CLEARS PLUGIN TOKEN · 401 RETURNS TO LOGIN · NO AUTO-REFRESH · DESKTOP LOGOUT LEAVES HELPER TOKEN</text>
        <line x1="40" y1="568" x2="920" y2="568" stroke="rgba(45,49,66,0.12)"/>
        <g font-family="'Geist Mono',monospace" font-size="8" fill="#4f5d75">
          <text x="40" y="588" letter-spacing=".14em">KEY</text>
          <line x1="100" y1="585" x2="140" y2="585" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mendeley-auth-arrow)"/>
          <text x="150" y="588">REQUEST</text>
          <line x1="250" y1="585" x2="210" y2="585" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#mendeley-auth-arrow-return)"/>
          <text x="260" y="588">RETURN</text>
          <line x1="360" y1="585" x2="400" y2="585" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#mendeley-auth-arrow-link)"/>
          <text x="410" y="588">API REQUEST</text>
        </g>

      </svg>
    </div>
  </main>
</body>
</html>
