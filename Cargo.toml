[package]
name = "mendeley-loopback-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mendeley-loopback-server"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
tiny_http = "0.12"
